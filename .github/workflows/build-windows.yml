name: Build Windows Installer

"on":
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # needed only for the release-publish step on tag pushes

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer + portable exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Authenticode signing — no-ops safely if these secrets are unset.
          # Set WIN_CSC_LINK (base64-encoded .pfx) and WIN_CSC_KEY_PASSWORD
          # in this repo's Settings → Secrets and variables → Actions once a
          # code-signing certificate has been obtained. See README "Code
          # signing" section for what's required before that's possible.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanWave-Net-Setup
          path: release/UrbanWave Net Setup *.exe
          if-no-files-found: error

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: UrbanWave-Net-Portable
          path: release/UrbanWave Net Portable *.exe
          if-no-files-found: error

      - name: Publish to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
