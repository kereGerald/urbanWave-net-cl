<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>UrbanWave Net — Connection issue</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: #0b1220;
    color: #e6ecf5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    max-width: 420px;
    text-align: center;
    padding: 32px;
  }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: #9aa8bd; font-size: 14px; line-height: 1.5; }
  .actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; }
  button {
    font: inherit;
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    font-size: 14px;
  }
  .primary { background: #3b82f6; color: white; }
  .secondary { background: #1c2740; color: #cdd8ea; }
  code { color: #6ea8ff; word-break: break-all; }
</style>
</head>
<body>
  <div class="card">
    <h1>Can't reach UrbanWave Net</h1>
    <p id="detail">Checking your internet connection and server status…</p>
    <div class="actions">
      <button class="primary" id="retryBtn">Retry</button>
      <button class="secondary" id="settingsBtn">Connection Settings</button>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const reason = params.get('reason') || '';
    document.getElementById('detail').textContent = navigator.onLine
      ? `The app couldn't load the UrbanWave Net dashboard. This usually means the server is starting up or temporarily unavailable. (${reason})`
      : 'Your computer appears to be offline. Check your internet connection and try again.';

    document.getElementById('retryBtn').addEventListener('click', () => {
      window.urbanwaveDesktop.retry();
    });
    document.getElementById('settingsBtn').addEventListener('click', () => {
      window.urbanwaveDesktop.openSettings();
    });
  </script>
</body>
</html>
